<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REY2ND-ENC</title>
<link rel="icon" href="https://files.catbox.moe/1tg25p.jpg">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --bg: #0a0a0a;
        --panel: #111111;
        --border: #1f1f1f;
        --ink: #e8e8e8;
        --gray: #666666;
        --lime: #c6ff00;
        --cyan: #00e5ff;
        --pink: #ff2d78;
        --yellow: #ffe600;
        --red: #ff3b30;
        --purple: #a855f7;
        --orange: #ff6b00;
    }

    html, body {
        width: 100%;
        min-height: 100vh;
        background: var(--bg);
        font-family: 'JetBrains Mono', 'SF Mono', 'Menlo', monospace;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
    }

    body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image:
            linear-gradient(rgba(198,255,0,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(198,255,0,0.03) 1px, transparent 1px);
        background-size: 50px 50px;
        pointer-events: none;
        z-index: 0;
    }

    .wrapper {
        position: relative;
        z-index: 1;
        max-width: 760px;
        margin: 0 auto;
        padding: 24px 20px 80px;
    }

    .header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 28px;
        padding-bottom: 20px;
        border-bottom: 2px solid var(--lime);
    }

    .logo {
        width: 68px;
        height: 68px;
        border: 2px solid var(--lime);
        background: var(--panel);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        overflow: hidden;
        box-shadow: 0 0 20px rgba(198,255,0,0.2);
    }

    .logo img { width: 100%; height: 100%; object-fit: cover; }

    .header-text h1 {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -1px;
        line-height: 1;
        color: var(--ink);
    }

    .header-text h1 span { color: var(--lime); }

    .header-text p {
        font-size: 11px;
        font-weight: 700;
        margin-top: 6px;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--gray);
    }

    .card {
        background: var(--panel);
        border: 1px solid var(--border);
        padding: 22px;
        margin-bottom: 18px;
        transition: border-color 0.2s ease;
    }

    .card:hover { border-color: #2a2a2a; }

    .card-title {
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 16px;
        color: var(--lime);
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .card-title::before {
        content: '';
        display: inline-block;
        width: 6px;
        height: 6px;
        background: var(--lime);
        box-shadow: 0 0 8px var(--lime);
    }

    .mode-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }

    .mode-btn {
        padding: 14px 12px;
        border: 1px solid var(--border);
        background: #0d0d0d;
        color: var(--ink);
        font-family: inherit;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        transition: all 0.15s ease;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        text-align: left;
    }

    .mode-btn .mode-name { font-size: 13px; font-weight: 800; letter-spacing: 1.5px; }
    .mode-btn .mode-desc { font-size: 10px; font-weight: 500; color: var(--gray); text-transform: none; letter-spacing: 0; line-height: 1.4; }

    .mode-btn:hover { border-color: var(--lime); background: #0f1400; }

    .mode-btn.active {
        border-color: var(--lime);
        background: rgba(198,255,0,0.08);
        box-shadow: inset 0 0 0 1px var(--lime), 0 0 20px rgba(198,255,0,0.15);
    }

    .mode-btn.active .mode-name { color: var(--lime); }

    .mode-btn[data-mode="rey2nd"].active { border-color: var(--cyan); background: rgba(0,229,255,0.08); box-shadow: inset 0 0 0 1px var(--cyan), 0 0 20px rgba(0,229,255,0.15); }
    .mode-btn[data-mode="rey2nd"].active .mode-name { color: var(--cyan); }

    .mode-btn[data-mode="jepang"].active { border-color: var(--pink); background: rgba(255,45,120,0.08); box-shadow: inset 0 0 0 1px var(--pink), 0 0 20px rgba(255,45,120,0.15); }
    .mode-btn[data-mode="jepang"].active .mode-name { color: var(--pink); }

    .mode-btn[data-mode="arab"].active { border-color: var(--yellow); background: rgba(255,230,0,0.08); box-shadow: inset 0 0 0 1px var(--yellow), 0 0 20px rgba(255,230,0,0.15); }
    .mode-btn[data-mode="arab"].active .mode-name { color: var(--yellow); }

    .mode-btn[data-mode="reyhere"].active { border-color: var(--red); background: rgba(255,59,48,0.08); box-shadow: inset 0 0 0 1px var(--red), 0 0 25px rgba(255,59,48,0.25); }
    .mode-btn[data-mode="reyhere"].active .mode-name { color: var(--red); }

    .drop-zone {
        border: 2px dashed var(--border);
        background: #0d0d0d;
        padding: 32px 20px;
        text-align: center;
        cursor: pointer;
        transition: all 0.15s ease;
        position: relative;
    }

    .drop-zone:hover, .drop-zone.dragover { border-color: var(--lime); background: rgba(198,255,0,0.04); }

    .drop-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

    .drop-icon { font-size: 36px; margin-bottom: 12px; line-height: 1; color: var(--lime); }

    .drop-text { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; }

    .drop-sub { font-size: 11px; color: var(--gray); margin-top: 6px; }

    .file-info {
        display: none;
        margin-top: 12px;
        padding: 12px 14px;
        border: 1px solid var(--lime);
        background: rgba(198,255,0,0.05);
        font-size: 12px;
        font-weight: 700;
        color: var(--lime);
        word-break: break-all;
    }

    .form-group { margin-bottom: 16px; }

    .form-label {
        display: block;
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-bottom: 8px;
        color: var(--gray);
    }

    .form-input {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid var(--border);
        background: #0d0d0d;
        font-family: inherit;
        font-size: 14px;
        color: var(--ink);
        outline: none;
        transition: all 0.15s ease;
    }

    .form-input:focus { border-color: var(--lime); box-shadow: 0 0 15px rgba(198,255,0,0.15); }
    .form-input::placeholder { color: #444; }

    .btn {
        display: block;
        width: 100%;
        padding: 18px;
        border: 1px solid var(--lime);
        background: var(--lime);
        color: #000;
        font-family: inherit;
        font-size: 14px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 2px;
        cursor: pointer;
        transition: all 0.15s ease;
        margin-top: 8px;
    }

    .btn:hover:not(:disabled) { background: #d4ff33; box-shadow: 0 0 30px rgba(198,255,0,0.3); }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn.secondary {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--border);
        font-size: 11px;
        padding: 12px;
    }

    .btn.secondary:hover { border-color: var(--lime); color: var(--lime); }

    .log {
        display: none;
        margin-top: 18px;
        border: 1px solid var(--border);
        background: #050505;
        color: var(--lime);
        font-size: 11px;
        line-height: 1.8;
        padding: 14px;
        max-height: 240px;
        overflow-y: auto;
        white-space: pre-wrap;
        word-break: break-all;
    }

    .log.show { display: block; }
    .log .err { color: var(--red); }
    .log .ok { color: var(--cyan); }
    .log .warn { color: var(--yellow); }

    .result {
        display: none;
        margin-top: 18px;
        border: 1px solid var(--lime);
        background: rgba(198,255,0,0.04);
        padding: 20px;
    }

    .result.show { display: block; }

    .result h3 {
        font-size: 13px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: var(--lime);
        margin-bottom: 14px;
    }

    .result-info {
        font-size: 11px;
        color: var(--gray);
        line-height: 1.8;
        margin-bottom: 14px;
    }

    .result-info strong { color: var(--ink); }

    .success-banner {
        display: none;
        padding: 14px 16px;
        border: 1px solid var(--lime);
        background: rgba(198,255,0,0.08);
        color: var(--lime);
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 16px;
        text-align: center;
    }

    .success-banner.show { display: block; animation: fadeIn 0.4s ease; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

    .footer {
        text-align: center;
        margin-top: 40px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--gray);
    }

    .tag {
        display: inline-block;
        border: 1px solid var(--border);
        padding: 3px 8px;
        margin: 4px 2px;
        font-size: 9px;
        color: var(--gray);
    }

    .tag.lime { color: var(--lime); border-color: var(--lime); }

    @media (max-width: 520px) {
        .header-text h1 { font-size: 22px; }
        .logo { width: 54px; height: 54px; }
        .card { padding: 16px; }
        .mode-grid { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>
<div class="wrapper">

    <div class="header">
        <div class="logo"><img src="https://files.catbox.moe/1tg25p.jpg" alt="REY2ND"></div>
        <div class="header-text">
            <h1>REY2ND<span>-ENC</span></h1>
            <p>File Encryption Engine</p>
        </div>
    </div>

    <div class="success-banner" id="successBanner">✓ FILE TELAH DIUPLOAD</div>

    <div class="card">
        <div class="card-title">01 / Mode Enkripsi</div>
        <div class="mode-grid">
            <button class="mode-btn" data-mode="hard" onclick="selectMode('hard')">
                <span class="mode-name">HARD</span>
                <span class="mode-desc">Enkripsi kuat, output besar. Sulit dibaca tapi masih bisa dijalankan.</span>
            </button>
            <button class="mode-btn" data-mode="biasa" onclick="selectMode('biasa')">
                <span class="mode-name">BIASA</span>
                <span class="mode-desc">Enkripsi ringan. Output kecil, cepat, gampang di-decode.</span>
            </button>
            <button class="mode-btn" data-mode="rey2nd" onclick="selectMode('rey2nd')">
                <span class="mode-name">REY2ND</span>
                <span class="mode-desc">Enkripsi signature REY2ND. File output ada tag rey2nd.</span>
            </button>
            <button class="mode-btn" data-mode="jepang" onclick="selectMode('jepang')">
                <span class="mode-name">JEPANG</span>
                <span class="mode-desc">Enkripsi karakter Jepang. Output berupa kanji, hiragana, katakana.</span>
            </button>
            <button class="mode-btn" data-mode="arab" onclick="selectMode('arab')">
                <span class="mode-name">ARAB</span>
                <span class="mode-desc">Enkripsi karakter Arab. Output berupa huruf Arab acak.</span>
            </button>
            <button class="mode-btn" data-mode="reyhere" onclick="selectMode('reyhere')">
                <span class="mode-name">REY IS HERE</span>
                <span class="mode-desc">Enkripsi paling susah ditembus. Multi-layer, output acak penuh.</span>
            </button>
        </div>
    </div>

    <div class="card">
        <div class="card-title">02 / Upload File</div>
        <div class="drop-zone" id="dropZone">
            <input type="file" id="fileInput" accept=".js,.html,.htm,.css,.json">
            <div class="drop-icon">⬆</div>
            <div class="drop-text">Tarik File ke Sini</div>
            <div class="drop-sub">atau klik — .js / .html / .css / .json</div>
        </div>
        <div class="file-info" id="fileInfo"></div>
    </div>

    <div class="card">
        <div class="card-title">03 / Kunci Enkripsi</div>
        <div class="form-group">
            <label class="form-label" for="secretKey">Secret Key (opsional)</label>
            <input class="form-input" type="text" id="secretKey" placeholder="kosongin kalau mau auto-generate" autocomplete="off" spellcheck="false">
        </div>
    </div>

    <button class="btn" id="encBtn" onclick="encryptFile()">ENKRIPSI SEKARANG</button>
    <button class="btn secondary" onclick="clearAll()">RESET</button>

    <div class="log" id="log"></div>

    <div class="result" id="result">
        <h3>✓ Enkripsi Berhasil</h3>
        <div class="result-info" id="resultInfo"></div>
        <button class="btn secondary" onclick="downloadResult()">⬇ DOWNLOAD HASIL</button>
    </div>

    <div class="footer">
        REY2ND-ENC · ENCRYPTION ENGINE<br>
        <span class="tag lime">HARD</span>
        <span class="tag">BIASA</span>
        <span class="tag">REY2ND</span>
        <span class="tag">JEPANG</span>
        <span class="tag">ARAB</span>
        <span class="tag lime">REY IS HERE</span>
    </div>

</div>

<script>
    let currentMode = null;
    let selectedFile = null;
    let resultBlob = null;
    let resultName = '';

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileInfo = document.getElementById('fileInfo');

    dropZone.addEventListener('dragover', e => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

    dropZone.addEventListener('drop', e => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener('change', e => {
        if (e.target.files.length) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
        const ext = file.name.split('.').pop().toLowerCase();
        if (!['js', 'html', 'htm', 'css', 'json'].includes(ext)) {
            alert('File harus .js / .html / .css / .json');
            return;
        }
        if (file.size > 10 * 1024 * 1024) {
            alert('Maksimal 10 MB');
            return;
        }
        selectedFile = file;
        fileInfo.style.display = 'block';
        fileInfo.textContent = '📦 ' + file.name + ' · ' + (file.size / 1024).toFixed(1) + ' KB';
        log('File dipilih: ' + file.name, 'ok');
    }

    function selectMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.mode-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.mode === mode);
        });
        log('Mode: ' + mode.toUpperCase(), 'ok');
    }

    function log(msg, type) {
        const el = document.getElementById('log');
        el.classList.add('show');
        const line = document.createElement('div');
        line.className = type || '';
        line.textContent = '> ' + msg;
        el.appendChild(line);
        el.scrollTop = el.scrollHeight;
    }

    function clearLog() {
        const el = document.getElementById('log');
        el.innerHTML = '';
        el.classList.remove('show');
    }

    function clearAll() {
        selectedFile = null;
        fileInput.value = '';
        fileInfo.style.display = 'none';
        document.getElementById('secretKey').value = '';
        document.getElementById('result').classList.remove('show');
        document.getElementById('successBanner').classList.remove('show');
        resultBlob = null;
        resultName = '';
        clearLog();
    }

    function randomKey(len) {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';
        let out = '';
        const bytes = new Uint8Array(len);
        crypto.getRandomValues(bytes);
        for (let i = 0; i < len; i++) out += chars[bytes[i] % chars.length];
        return out;
    }

    function xorBuffer(buffer, key) {
        const out = new Uint8Array(buffer.length);
        const keyBytes = new TextEncoder().encode(key);
        for (let i = 0; i < buffer.length; i++) {
            out[i] = buffer[i] ^ keyBytes[i % keyBytes.length];
        }
        return out;
    }

    function toBase64(bytes) {
        let bin = '';
        const chunk = 0x8000;
        for (let i = 0; i < bytes.length; i += chunk) {
            bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
        }
        return btoa(bin);
    }

    function rotateBytes(bytes, shift) {
        const out = new Uint8Array(bytes.length);
        const s = ((shift % 256) + 256) % 256;
        for (let i = 0; i < bytes.length; i++) out[i] = (bytes[i] + s) & 0xff;
        return out;
    }

    function reverseBytes(bytes) {
        const out = new Uint8Array(bytes.length);
        for (let i = 0; i < bytes.length; i++) out[i] = bytes[bytes.length - 1 - i];
        return out;
    }

    function bytesToUnicode(bytes, pool) {
        const chars = Array.from(pool);
        let out = '';
        for (let i = 0; i < bytes.length; i++) {
            out += chars[bytes[i] % chars.length];
        }
        return out;
    }

    const JEPANG_POOL = (() => {
        let s = '';
        for (let i = 0x3041; i <= 0x3096; i++) s += String.fromCharCode(i);
        for (let i = 0x30A1; i <= 0x30FA; i++) s += String.fromCharCode(i);
        for (let i = 0x4E00; i <= 0x4EFF; i++) s += String.fromCharCode(i);
        return s;
    })();

    const ARAB_POOL = (() => {
        let s = '';
        for (let i = 0x0600; i <= 0x06FF; i++) s += String.fromCharCode(i);
        for (let i = 0x0750; i <= 0x077F; i++) s += String.fromCharCode(i);
        return s;
    })();

    const REY_POOL = (() => {
        let s = '';
        for (let i = 0x0100; i <= 0x04FF; i++) s += String.fromCharCode(i);
        for (let i = 0x0530; i <= 0x058F; i++) s += String.fromCharCode(i);
        for (let i = 0x05D0; i <= 0x05EA; i++) s += String.fromCharCode(i);
        return s;
    })();

    // ============================================================
    // ENCRYPT
    // ============================================================
    async function encryptFile() {
        if (!currentMode) return alert('Pilih mode enkripsi dulu');
        if (!selectedFile) return alert('Upload file dulu');

        const btn = document.getElementById('encBtn');
        btn.disabled = true;
        btn.textContent = 'MEMPROSES...';
        document.getElementById('result').classList.remove('show');
        document.getElementById('successBanner').classList.remove('show');
        clearLog();

        let key = document.getElementById('secretKey').value.trim();
        if (!key) {
            key = randomKey(32);
            log('Auto key: ' + key.substring(0, 12) + '...', 'warn');
        }

        log('Mode: ' + currentMode.toUpperCase());
        log('File: ' + selectedFile.name);
        log('Key length: ' + key.length);

        try {
            const buffer = await selectedFile.arrayBuffer();
            const baseName = selectedFile.name.replace(/\.[^.]+$/, '');
            const ext = selectedFile.name.split('.').pop().toLowerCase();

            // Kalau .html atau .js -> tetap .html/.js
            // Kalau .css/.json -> ubah jadi .html biar bisa dibuka browser
            const isHtml = ext === 'html' || ext === 'htm';
            const isJs = ext === 'js';
            const finalExt = isHtml ? 'html' : (isJs ? 'js' : 'html');

            let output, outName;

            if (currentMode === 'biasa') {
                output = encryptBiasa(buffer, key, finalExt);
                outName = baseName + '.enc.' + finalExt;
            } else if (currentMode === 'hard') {
                output = encryptHard(buffer, key, finalExt);
                outName = baseName + '.hard.enc.' + finalExt;
            } else if (currentMode === 'rey2nd') {
                output = encryptRey2nd(buffer, key, finalExt);
                outName = baseName + '_rey2nd.enc.' + finalExt;
            } else if (currentMode === 'jepang') {
                output = encryptJepang(buffer, key, finalExt);
                outName = baseName + '.jp.enc.' + finalExt;
            } else if (currentMode === 'arab') {
                output = encryptArab(buffer, key, finalExt);
                outName = baseName + '.ar.enc.' + finalExt;
            } else if (currentMode === 'reyhere') {
                output = encryptReyHere(buffer, key, finalExt);
                outName = baseName + '_REY_IS_HERE.enc.' + finalExt;
            }

            const mime = finalExt === 'html' ? 'text/html' : 'application/javascript';
            resultBlob = new Blob([output], { type: mime });
            resultName = outName;

            log('Output: ' + outName, 'ok');
            log('Ukuran output: ' + (resultBlob.size / 1024).toFixed(1) + ' KB', 'ok');

            const resultInfo = document.getElementById('resultInfo');
            resultInfo.innerHTML =
                '<strong>Nama file:</strong> ' + outName + '<br>' +
                '<strong>Mode:</strong> ' + currentMode.toUpperCase() + '<br>' +
                '<strong>Ukuran output:</strong> ' + (resultBlob.size / 1024).toFixed(1) + ' KB<br>' +
                '<strong>Key:</strong> ' + key;
            document.getElementById('result').classList.add('show');

            // Tampilkan banner sukses
            document.getElementById('successBanner').classList.add('show');

            // Reset form upload biar bisa upload lagi
            selectedFile = null;
            fileInput.value = '';
            fileInfo.style.display = 'none';
            document.getElementById('secretKey').value = '';
            currentMode = null;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));

            log('Form direset. Siap upload file berikutnya.', 'ok');

        } catch (err) {
            log('ERROR: ' + err.message, 'err');
            console.error(err);
        } finally {
            btn.disabled = false;
            btn.textContent = 'ENKRIPSI SEKARANG';
        }
    }

    // ============================================================
    // MODE IMPLEMENTATIONS — output berupa HTML/JS valid
    // ============================================================

    // BIASA: JS module yang nge-decode base64 saat di-load
    function encryptBiasa(buffer, key, ext) {
        const bytes = new Uint8Array(buffer);
        const xored = xorBuffer(bytes, key);
        const b64 = toBase64(xored);
        const reverseKey = key.split('').reverse().join('');

        if (ext === 'html') {

    function simpleHash(str) {
        let h = 0;
        for (let i = 0; i < str.length; i++) {

    }
